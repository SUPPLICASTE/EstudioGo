name: EstudioGo - Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Compilar instalador Windows
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activar soporte Windows
        run: flutter create --platforms=windows --project-name=estudiogo --org com.supplicaste .

      - name: Descargar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Compilar EXE
        shell: pwsh
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crear instalador único EXE
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          if (!(Test-Path "$source/estudiogo.exe")) {
            throw "No se ha generado estudiogo.exe"
          }
          @'
          [Setup]
          AppId={{A2F8BCA4-90D7-4F55-9D9E-202611100001}
          AppName=EstudioGo
          AppVersion=2.2
          AppPublisher=SUPPLICASTE
          DefaultDirName={localappdata}\Programs\EstudioGo
          DefaultGroupName=EstudioGo
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=.
          OutputBaseFilename=EstudioGo-Instalador-Windows
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\estudiogo.exe

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\EstudioGo"; Filename: "{app}\estudiogo.exe"
          Name: "{autodesktop}\EstudioGo"; Filename: "{app}\estudiogo.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Crear acceso directo en el escritorio"; GroupDescription: "Accesos directos:"
          '@ | Set-Content -Path "estudiogo-installer.iss" -Encoding ASCII
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "No se encuentra Inno Setup: $compiler" }
          & $compiler "estudiogo-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falló la creación del instalador" }

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EstudioGo-Instalador-Windows
          path: EstudioGo-Instalador-Windows.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar versión Windows en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2
          name: EstudioGo 2.2 - Windows
          target_commitish: main
          files: EstudioGo-Instalador-Windows.exe
          overwrite_files: true
          make_latest: false
