name: EstudioGo - APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar proyecto Android limpio
        run: flutter create --platforms=android --project-name=estudiogo --org com.supplicaste .
      - name: Configurar icono y permisos Android
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/estudiogo_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#123B8A" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M18,30c0,-5 4,-9 9,-9h22c8,0 14,3 19,8 5,-5 11,-8 19,-8h3c5,0 9,4 9,9v48c0,5 -4,9 -9,9h-3c-8,0 -14,-3 -19,-8 -5,5 -11,8 -19,8h-22c-5,0 -9,-4 -9,-9z"/>
            <path android:fillColor="#2563EB" android:pathData="M49,29h8v49h-8z"/>
            <path android:fillColor="#FBBF24" android:pathData="M74,13l4,8 9,1 -7,6 2,9 -8,-5 -8,5 2,-9 -7,-6 9,-1z"/>
            <path android:fillColor="#16A34A" android:pathData="M65,58l7,7 14,-16 6,6 -20,22 -13,-13z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]
          for permission in permissions:
              if permission.strip() not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/estudiogo_icon"')
          if 'android:usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          receiver = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:enabled="false" android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receiver + '\n    </application>')
          p.write_text(s)
          PY
      - name: Activar desugaring para notificaciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          # Forzar API 36: Flutter template usa flutter.compileSdkVersion (API 34).
          s = s.replace("flutter.compileSdkVersion", "36")
          import re
          s, count = re.subn(r"(?m)^[ \t]*compileSdk(?:Version)?[ \t]*(?:=[ \t]*)?[^\n]*$", "    compileSdk = 36", s)
          if "compileSdk = 36" not in s:
              raise RuntimeError("No se pudo establecer compileSdk 36 en Gradle")
          print("Configuración Android aplicada:")
          for line in s.splitlines():
              if "compileSdk" in line:
                  print(line)
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          if "desugar_jdk_libs" not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          # Fijar AGP 8: AGP 9 aún presenta incompatibilidades con Flutter estable.
          settings = Path("android/settings.gradle.kts")
          settings_text = settings.read_text()
          import re
          settings_text, changed = re.subn(r'(id\("com\.android\.application"\)\s+version\s+)"[^"]+"', r'\g<1>"8.11.1"', settings_text, count=1)
          if changed == 0:
              raise RuntimeError("No se pudo fijar Android Gradle Plugin 8.9.1")
          settings.write_text(settings_text)
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          wrapper_text = wrapper.read_text()
          wrapper_text = re.sub(r'gradle-[0-9.]+-(all|bin)\.zip', r'gradle-8.14.3-\1.zip', wrapper_text)
          wrapper.write_text(wrapper_text)
          # Establecer compileSdk 36 en todos los módulos Android library de plugins Flutter.
          root = Path("android/build.gradle.kts")
          gradle = root.read_text()
          force_sdk = """
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension>("android") {
                      compileSdk = 36
                  }
              }
          }
          """
          if "LibraryExtension" not in gradle:
              root.write_text(gradle + "\n" + force_sdk)
          PY
      - name: Descargar dependencias
        run: flutter pub get
      - name: Analizar código
        run: flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        run: flutter build apk --release
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudioGo-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Preparar APK con nombre de aplicación
        run: cp build/app/outputs/flutter-apk/app-release.apk EstudioGo.apk
      - name: Publicar aplicación descargable en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.1"
          name: "EstudioGo 2.1"
          target_commitish: main
          files: EstudioGo.apk
          overwrite_files: true
          make_latest: true
