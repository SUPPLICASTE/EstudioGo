name: Build EstudioGo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and web projects
        run: flutter create --platforms=android,web --project-name=estudiogo .
      - name: Apply EstudioGo Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/estudiogo_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#2563EB" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M25,19h40c13,0 21,7 21,18 0,8 -4,13 -11,16 9,2 14,9 14,18 0,12 -9,19 -24,19h-40z M36,30v18h27c7,0 11,-3 11,-9 0,-6 -4,-9 -11,-9z M36,58v21h29c8,0 12,-4 12,-10 0,-7 -4,-11 -12,-11z"/>
            <path android:fillColor="#FBBF24" android:pathData="M17,88l10,-10 10,10 -10,10z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/estudiogo_icon"')
          p.write_text(s)
          PY
      - name: Configure Android exam notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
          ]
          for item in permissions:
              if item not in s:
                  s = s.replace('<application', item + '\\n    <application', 1)
          receiver = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:enabled="false" android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receiver + '\\n    </application>')
          p.write_text(s)
          PY
      - name: Add camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />\\n'
          if permission.strip() not in s:
              s = s.replace("<application", permission + "    <application", 1)
              p.write_text(s)
          PY
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Build web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: EstudioGo-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EstudioGo-Web
          path: build/web/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows project
        run: flutter create --platforms=windows --project-name=estudiogo .
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: EstudioGo-Windows
          path: build/windows/x64/runner/Release/
